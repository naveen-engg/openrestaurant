services:
  postgres:
    image: postgres:16-alpine
    container_name: openfront-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: openfront_restaurant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openfront-restaurant
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/openfront_restaurant
      SESSION_SECRET: openfront-restaurant-production-session-secret-super-secure-key-32chars
      SEED_DATABASE: "true"
      DB_HOST: postgres
      DB_PORT: 5432
      PORT: 3000

volumes:
  postgres_data:
